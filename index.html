<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&family=Trirong:wght@300;400&family=Chonburi&family=Anton&family=Abril+Fatface&family=Special+Elite&family=Caveat:wght@500;600&family=Mali:wght@400;500;700&family=Yesteryear&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style id="app-style">:root{
  --accent:#C8322B; --accent-ink:#FFFFFF; --warn:#C8322B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.t-jazz{--desk:#E9DFD2;--desk-ink:#3B2A1E;--desk-muted:#7A6553;--desk-line:#CDBBA6;--desk-btn:#F5EEE5;--desk-panel:#FBF7F1;--accent:#9A5B22;--accent-ink:#fff}
body.t-collage{--desk:#EFE6D6;--desk-ink:#1F1D2E;--desk-muted:#6E675F;--desk-line:#D3C7B2;--desk-btn:#FBF6EC;--desk-panel:#FBF6EC;--accent:#C8322B;--accent-ink:#fff}
body.t-neon{--desk:#EFE4D8;--desk-ink:#3B2C2A;--desk-muted:#8A7570;--desk-line:#D6C4B8;--desk-btn:#FBF5F0;--desk-panel:#FBF5F0;--accent:#E0789F;--accent-ink:#fff}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark}
  :root:not([data-theme="light"]) body.t-jazz{--desk:#0E0906;--desk-ink:#EADBC4;--desk-muted:#9C8569;--desk-line:#3A2B1F;--desk-btn:#1B130D;--desk-panel:#160F0A;--accent:#E3C48C;--accent-ink:#1B120C;--warn:#F0A35C}
  :root:not([data-theme="light"]) body.t-collage{--desk:#14131A;--desk-ink:#EFE6D6;--desk-muted:#9A927F;--desk-line:#3A3744;--desk-btn:#201E28;--desk-panel:#1A1821;--accent:#E8B64B;--accent-ink:#17161C;--warn:#F08A7A}
  :root:not([data-theme="light"]) body.t-neon{--desk:#15100F;--desk-ink:#F2E6DF;--desk-muted:#9C8882;--desk-line:#3D302D;--desk-btn:#221B19;--desk-panel:#1B1514;--accent:#F9A8C9;--accent-ink:#2C1F1C;--warn:#F08A7A}
}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"] body.t-jazz{--desk:#0E0906;--desk-ink:#EADBC4;--desk-muted:#9C8569;--desk-line:#3A2B1F;--desk-btn:#1B130D;--desk-panel:#160F0A;--accent:#E3C48C;--accent-ink:#1B120C;--warn:#F0A35C}
:root[data-theme="dark"] body.t-collage{--desk:#14131A;--desk-ink:#EFE6D6;--desk-muted:#9A927F;--desk-line:#3A3744;--desk-btn:#201E28;--desk-panel:#1A1821;--accent:#E8B64B;--accent-ink:#17161C;--warn:#F08A7A}
:root[data-theme="dark"] body.t-neon{--desk:#15100F;--desk-ink:#F2E6DF;--desk-muted:#9C8882;--desk-line:#3D302D;--desk-btn:#221B19;--desk-panel:#1B1514;--accent:#F9A8C9;--accent-ink:#2C1F1C;--warn:#F08A7A}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--desk-ink);font-size:16px;line-height:1.6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;padding:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.book{position:relative;width:min(92vw, calc((100vh - 140px) / 1.42), 440px);aspect-ratio:1/1.42;perspective:2400px;flex:0 0 auto}
@supports (height:100dvh){ .book{width:min(92vw, calc((100dvh - 140px) / 1.42), 440px)} }
.stack{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow:hidden;transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,.7,.2,1);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer}
.page.turned{transform:rotateY(-178deg)}
.pad{position:absolute;inset:0;display:flex;flex-direction:column;z-index:3}
.corner{position:absolute;z-index:4}
.tl{top:16px;left:26px}.tr{top:16px;right:18px;text-align:right}.bl{bottom:14px;left:26px;right:60px}.br{bottom:14px;right:18px;text-align:right}
.topmid{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:3}
.cover{cursor:default}
.lockbox{position:absolute;left:0;right:0;bottom:46px;text-align:center;z-index:5}
.code{display:flex;gap:12px;justify-content:center;margin:8px 0 4px}
.code input{width:2.1rem;height:2.5rem;text-align:center;font-size:22px;border-radius:0}
.err{min-height:1.4em;font-size:12px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.counter{justify-content:center;align-items:center;text-align:center}
.hms{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hms div{display:flex;flex-direction:column;align-items:center}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:.55em .9em;cursor:pointer}
.opt.wrong{animation:shake .4s}
.qmsg{min-height:1.5em;margin-top:10px;font-size:12px}
.letter{white-space:pre-wrap;overflow:auto}
.caret{display:inline-block;width:1.5px;height:1.1em;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ending{justify-content:center;align-items:center;text-align:center}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.nbtn{background:var(--desk-btn);border:1px solid var(--desk-line);color:var(--desk-ink);padding:.4em 1.2em;cursor:pointer;font-size:14px}
.nbtn:disabled{opacity:.35;cursor:default}
#count{font-size:14px;color:var(--desk-muted);min-width:84px;text-align:center}
.tip{font-size:12px;color:var(--desk-muted);margin:0;text-align:center}
#editBtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.theme-pick{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.theme-pick label{flex:1 1 150px;border:2px solid var(--desk-line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--desk-btn)}
.theme-pick label.on{border-color:var(--accent)}
.theme-pick input{margin:0}
.theme-pick .sw{width:34px;height:46px;border-radius:3px;flex:0 0 auto;display:grid;place-items:center;font-size:16px}
.theme-pick b{display:block;font-size:14px;font-weight:600}
.theme-pick small{display:block;font-size:12px;color:var(--desk-muted);line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.t-editorial{--desk:#F4E9EC;--desk-ink:#3B2E33;--desk-muted:#8A777E;--desk-line:#DCC8CF;--desk-btn:#FCF7F8;--desk-panel:#FCF7F8;--accent:#E88FB0;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.t-editorial{--desk:#17121A;--desk-ink:#F3E7EC;--desk-muted:#9E8A93;--desk-line:#3D3038;--desk-btn:#241C24;--desk-panel:#1C161E;--accent:#F7A8C3;--accent-ink:#2A1F26;--warn:#F08A7A}}
:root[data-theme="dark"] body.t-editorial{--desk:#17121A;--desk-ink:#F3E7EC;--desk-muted:#9E8A93;--desk-line:#3D3038;--desk-btn:#241C24;--desk-panel:#1C161E;--accent:#F7A8C3;--accent-ink:#2A1F26;--warn:#F08A7A}
/* photo grid pages (several photos on one page) */
.grid{position:absolute;inset:0;display:grid;gap:3px;z-index:0}
.grid>div{position:relative;overflow:hidden;background:#555}
.grid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid.g2{grid-template-rows:1fr 1fr}
.grid.g3{grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr}.grid.g3>div:first-child{grid-row:1/3}
.grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid.g5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1.1fr 1fr}.grid.g5>div:nth-child(1){grid-column:1/3}.grid.g5>div:nth-child(2){grid-column:3}
.grid.g6{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.gc{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);z-index:3;text-align:center}
body.t-collage .grid{gap:6px;padding:6px;background:#fff}
body.t-collage .grid>div{background:#D8D2C5}
body.t-collage .gc .ransom{font-size:clamp(34px,10vw,52px)}
body.t-collage .gc .hand{display:block;font-size:clamp(20px,6vw,28px);color:#2B2E6B;background:rgba(255,255,255,.85);padding:2px 10px;margin:0 auto 6px;width:max-content;max-width:100%;transform:rotate(-2deg)}
body.t-jazz .grid{background:#1B120C}
body.t-jazz .gc .serif{font-size:clamp(40px,12vw,60px);display:block;text-shadow:0 2px 16px rgba(0,0,0,.7)}
body.t-jazz .gc .script{font-size:clamp(26px,8vw,38px);display:block;margin-top:-.2em}
body.t-neon .gc .neon.big{font-size:clamp(44px,13vw,66px);display:block;transform:rotate(-6deg)}
body.t-neon .gc .neon.sub{font-size:clamp(26px,7.5vw,36px);display:block;margin-top:-.15em;transform:rotate(-6deg)}

/* jazz */
body.t-jazz{font-family:"Trirong","Playfair Display",Georgia,serif}
body.t-jazz .serif{font-family:"Playfair Display",Georgia,serif;font-weight:400;line-height:.9;letter-spacing:-.01em;color:#E3C48C}
body.t-jazz .script{font-family:"Pinyon Script",cursive;color:#F2E6CF;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
body.t-jazz .th-display{font-family:"Chonburi","Playfair Display",serif;color:#F2E6CF;line-height:1.4;font-weight:400}
body.t-jazz .cap{font-family:"Playfair Display",serif;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#B49C7C;line-height:1.5}
body.t-jazz .th{font-family:"Trirong",serif;font-weight:300;color:#F2E6CF}
body.t-jazz .pno{font-family:"Playfair Display",serif;font-size:9px;letter-spacing:.32em;color:#B49C7C}
body.t-jazz .stack{border-radius:3px 10px 10px 3px;box-shadow:3px 3px 0 -1px #2A1C13,3px 3px 0 0 #000,6px 6px 0 -1px #2A1C13,6px 6px 0 0 #000,0 24px 50px rgba(20,8,0,.45)}
body.t-jazz .page{background:#1B120C;color:#F2E6CF;border-radius:3px 10px 10px 3px;box-shadow:inset 18px 0 22px -14px rgba(0,0,0,.8)}
body.t-jazz .pad{padding:30px 26px 30px 34px}
body.t-jazz .film{position:absolute;inset:0;background-color:#2a1a10;overflow:hidden;
  background-image:radial-gradient(circle at 18% 72%, rgba(255,196,120,.85) 0 2.2%, transparent 3.2%),radial-gradient(circle at 30% 80%, rgba(255,180,100,.55) 0 3.5%, transparent 5%),radial-gradient(circle at 74% 30%, rgba(255,210,150,.6) 0 1.6%, transparent 2.6%),radial-gradient(circle at 82% 66%, rgba(255,170,90,.5) 0 4%, transparent 6%),radial-gradient(circle at 60% 85%, rgba(255,220,170,.7) 0 1.4%, transparent 2.4%),radial-gradient(ellipse at 55% 40%, #7a4a28 0%, transparent 65%),linear-gradient(180deg,#1f140d,#3a2416 60%,#140c07)}
body.t-jazz .film img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.22) saturate(1.08) contrast(1.04) brightness(.86)}
body.t-jazz .film::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7));pointer-events:none}
body.t-jazz .film .ph{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.2em;color:rgba(242,230,207,.55);border:1px solid rgba(242,230,207,.3);padding:.3em .9em;white-space:nowrap}
body.t-jazz .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,18,12,.35) 0%,transparent 25%,transparent 45%,rgba(27,18,12,.92) 72%,#1B120C 100%)}
body.t-jazz .cover .titles{position:absolute;left:0;right:0;top:20%;text-align:center;z-index:2;padding:0 14px}
body.t-jazz .cover .serif.big{font-size:clamp(60px,20vw,110px)}
body.t-jazz .cover .script.over{font-size:clamp(30px,9vw,48px);display:block;margin-top:-.3em;transform:rotate(-4deg)}
body.t-jazz .code input{font-family:"Playfair Display",serif;border:0;border-bottom:1px solid #E3C48C;background:transparent;color:#F2E6CF}
body.t-jazz .code input:focus{outline:none;border-bottom-width:2px}
body.t-jazz .gbtn{background:transparent;border:1px solid #E3C48C;color:#E3C48C;padding:.45em 1.8em;font-family:"Playfair Display",serif;font-style:italic;font-size:15px;cursor:pointer;margin-top:6px}
body.t-jazz .err{color:#F0A35C}
body.t-jazz .counter .script{font-size:clamp(34px,10vw,46px)}
body.t-jazz .counter .num{font-size:clamp(84px,26vw,140px);margin:.05em 0 0;font-variant-numeric:lining-nums}
body.t-jazz .counter .unit{font-family:"Playfair Display",serif;font-style:italic;font-size:26px;color:#F2E6CF;margin:0 0 22px}
body.t-jazz .hms{gap:22px}
body.t-jazz .hms b{font-family:"Playfair Display",serif;font-weight:400;font-size:22px;color:#F2E6CF;font-variant-numeric:tabular-nums}
body.t-jazz .rule{width:40px;border-top:1px solid rgba(227,196,140,.28);margin:22px auto}
body.t-jazz .mem .film,body.t-jazz .mem .fade{bottom:34%}
body.t-jazz .mem .words{position:absolute;left:22px;right:18px;top:40%;z-index:2}
body.t-jazz .mem .serif.big{font-size:clamp(44px,14vw,72px);display:block}
body.t-jazz .mem .script.over{font-size:clamp(28px,8.5vw,42px);display:block;margin:-.25em 0 0 18%;transform:rotate(-5deg)}
body.t-jazz .mem .body{position:absolute;left:26px;right:22px;bottom:40px;z-index:2}
body.t-jazz .mem .th-display{font-size:clamp(16px,4.6vw,19px);margin:0 0 .3em}
body.t-jazz .mem .th{font-size:clamp(13px,3.7vw,15px);margin:0;line-height:1.75}
body.t-jazz .list{margin-top:18px}
body.t-jazz .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid rgba(227,196,140,.28)}
body.t-jazz .row .th{font-size:14px}
body.t-jazz .row .num{font-family:"Playfair Display",serif;color:#E3C48C;font-size:clamp(26px,8vw,36px);line-height:1;white-space:nowrap}
body.t-jazz .row .num small{font-family:"Trirong",serif;font-size:13px;color:#B49C7C;margin-left:4px}
body.t-jazz .opt{border:1px solid rgba(227,196,140,.28);background:transparent;font-family:"Trirong",serif;color:#F2E6CF}
body.t-jazz .opt.wrong{border-color:#F0A35C}
body.t-jazz .opt.right{border-color:#E3C48C;background:rgba(227,196,140,.14)}
body.t-jazz .qmsg{color:#B49C7C}
body.t-jazz .qq{font-family:"Chonburi",serif;color:#F2E6CF;font-size:17px;margin:.3em 0 0}
body.t-jazz .letter-head{font-size:clamp(44px,13vw,60px);margin:0 0 6px}
body.t-jazz .letter{font-family:"Trirong",serif;font-weight:300;font-size:clamp(13px,3.7vw,15.5px);line-height:1.95;color:#F2E6CF}
body.t-jazz .caret{background:#E3C48C}
body.t-jazz .ending .script{font-size:clamp(46px,14vw,66px)}
body.t-jazz .nbtn{font-family:"Trirong",serif;border-radius:2px}
body.t-jazz #count{font-family:"Playfair Display",serif;font-style:italic}
/* collage */
body.t-collage{font-family:"Mali","Caveat",cursive;background-image:radial-gradient(var(--desk-line) .8px,transparent .9px);background-size:18px 18px}
body.t-collage .hand{font-family:"Caveat",cursive;font-weight:500;line-height:1.05;color:#1F1D2E}
body.t-collage .hand-th{font-family:"Mali",cursive;color:#1F1D2E;line-height:1.6}
body.t-collage .type{font-family:"Special Elite","Courier New",monospace;color:#1F1D2E;line-height:1.3}
body.t-collage .poster{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;line-height:1}
body.t-collage .ransom{display:inline-block;line-height:1;white-space:normal}
body.t-collage .ransom .l{display:inline-block;padding:.02em .1em;margin:.04em .01em;line-height:1;transform:rotate(var(--r));box-shadow:1px 2px 0 rgba(0,0,0,.18)}
body.t-collage .ransom .sp{display:inline-block;width:.35em}
body.t-collage .ransom .r0{font-family:"Anton",sans-serif;background:#2B2E6B;color:#F6EFE1}
body.t-collage .ransom .r1{font-family:"Abril Fatface",serif;background:#FFFDF7;color:#C8322B}
body.t-collage .ransom .r2{font-family:"Special Elite",monospace;background:#E8B64B;color:#17161C}
body.t-collage .ransom .r3{font-family:"Playfair Display",serif;font-style:italic;background:#F6EFE1;color:#3B8EA5;border:1px solid rgba(0,0,0,.12)}
body.t-collage .ransom .r4{font-family:"Anton",sans-serif;background:#C8322B;color:#F6EFE1;clip-path:polygon(3% 0,97% 4%,100% 92%,94% 100%,4% 97%,0 8%)}
body.t-collage .ransom .r5{font-family:"Abril Fatface",serif;background:#F3BBC9;color:#2B2E6B}
body.t-collage .ransom .r6{font-family:"Special Elite",monospace;background:#fff;color:#17161C;border:1px solid rgba(0,0,0,.2)}
body.t-collage .ransom .r7{font-family:"Anton",sans-serif;background:#3B8EA5;color:#F6EFE1;clip-path:polygon(0 3%,96% 0,100% 96%,5% 100%)}
body.t-collage .pno{font-family:"Special Elite",monospace;font-size:11px;color:#6E675F}
body.t-collage .stack{border-radius:3px 8px 8px 3px;box-shadow:3px 3px 0 -1px #F6EFE1,3px 3px 0 0 #C9BBA3,6px 6px 0 -1px #F6EFE1,6px 6px 0 0 #C9BBA3,0 22px 44px rgba(40,30,20,.3)}
body.t-collage .page{background:#F6EFE1;color:#1F1D2E;border-radius:3px 8px 8px 3px;
  background-image:linear-gradient(90deg,rgba(0,0,0,.08),transparent 22px),repeating-linear-gradient(0deg,transparent 0 23px,rgba(43,46,107,.08) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(43,46,107,.08) 23px 24px)}
body.t-collage .pad{padding:30px 24px 30px 34px}
body.t-collage .tl{left:28px}
body.t-collage .bl{left:28px}
body.t-collage .tape{position:absolute;width:72px;height:22px;background:rgba(255,241,170,.75);box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:3;background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.35) 6px 8px)}
body.t-collage .ticket{display:inline-block;background:#F3BBC9;color:#17161C;padding:4px 10px;font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;line-height:1.15;text-align:center;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 5px,#000 5.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 5px,#000 5.5px) right/51% 100% no-repeat;box-shadow:1px 2px 0 rgba(0,0,0,.15)}
body.t-collage .ticket.yellow{background:#E8B64B}
body.t-collage .ticket.blue{background:#CFE6EC}
body.t-collage .ticket small{display:block;font-family:"Special Elite",monospace;text-transform:none;letter-spacing:0;font-size:10px}
body.t-collage .sticker{position:absolute;font-size:56px;line-height:1;z-index:4;filter:drop-shadow(1px 3px 2px rgba(0,0,0,.25));pointer-events:none}
body.t-collage .banner{display:inline-block;background:#C8322B;color:#F6EFE1;padding:6px 14px;font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11px;transform:rotate(-2deg);box-shadow:2px 3px 0 rgba(0,0,0,.2)}
body.t-collage .stamp{display:inline-block;border:2px solid #C8322B;color:#C8322B;padding:3px 9px;font-family:"Special Elite",monospace;text-transform:uppercase;font-size:11px;letter-spacing:.1em;transform:rotate(-8deg);opacity:.85;border-radius:3px}
body.t-collage .arrow{font-family:"Caveat",cursive;font-size:18px;color:#2B2E6B}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;z-index:100;background:var(--desk-panel);color:var(--desk-ink);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 0px) 0 calc(env(safe-area-inset-bottom,0px) + 90px)}
#editor[hidden]{display:none}
.ed-head{position:sticky;top:0;z-index:2;background:var(--desk-panel);border-bottom:1px solid var(--desk-line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.ed-head h2{margin:0;font-weight:600;font-size:19px;flex:1}
.ed-wrap{max-width:640px;margin:0 auto;padding:8px 18px}
.ed-sec{padding:22px 0;border-bottom:1px solid var(--desk-line)}
.ed-sec h3{font-weight:600;font-size:16px;margin:0 0 4px}
.ed-sec>p{margin:0 0 14px;font-size:14px;color:var(--desk-muted)}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:13px;color:var(--desk-muted);margin-bottom:3px}
.f input,.f textarea,.f select{width:100%;font:inherit;font-size:16px;padding:.5em .7em;border:1px solid var(--desk-line);background:var(--desk-btn);color:var(--desk-ink);border-radius:4px}
.f textarea{min-height:90px;resize:vertical;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.mcard{border:1px solid var(--desk-line);border-radius:6px;padding:14px;margin-bottom:14px;background:var(--desk-btn)}
.mcard-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.thumb{width:96px;aspect-ratio:3/4;flex:0 0 auto;border-radius:4px;background:#D8D2C5 center/cover no-repeat;display:grid;place-items:center;color:#6E675F;font-size:11px;text-align:center;padding:4px}
.mcard-act{display:flex;flex-direction:column;gap:6px;flex:1}
.mcard-act .row2{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{background:var(--desk-panel);border:1px solid var(--desk-line);color:var(--desk-ink);padding:.3em .8em;font-size:13px;cursor:pointer;border-radius:3px}
.sbtn.danger{color:var(--warn);border-color:var(--warn)}
.sbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.qcard{border:1px solid var(--desk-line);border-radius:6px;padding:14px;margin-bottom:12px}
.ed-bar{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--desk-panel);border-top:1px solid var(--desk-line);
  padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ed-bar[hidden]{display:none}
.size{flex:1;font-size:12px;color:var(--desk-muted);min-width:140px}
.size.over{color:var(--warn)}
.status{font-size:13px;color:var(--desk-muted);width:100%;text-align:right;min-height:1.2em}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}.grid3 .f:first-child{grid-column:1/-1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.thumbs .t{position:relative;width:72px;aspect-ratio:3/4;border-radius:4px;background:#D8D2C5 center/cover no-repeat;border:1px solid var(--desk-line)}
.thumbs .t.main::after{content:"หลัก";position:absolute;left:4px;top:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:2px}
.thumbs .t button{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:12px;line-height:22px;padding:0;cursor:pointer}
</style>

<script id="app-script">
(function () {
  const SAVED = JSON.parse(document.getElementById("book-data").textContent);
  const migrate = d => { (d.moments || []).forEach(m => { if (!Array.isArray(m.photos)) m.photos = m.photo ? [m.photo] : []; delete m.photo; }); if (!d.theme) d.theme = "neon"; return d; };
  let data = migrate(JSON.parse(JSON.stringify(SAVED)));
  const MAX_BYTES = 16 * 1024 * 1024;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const THEMES = {

    editorial: { name: "Soft Editorial", desc: "รูปเต็มหน้า ขาวเซอริฟผสมชมพู ป้ายชมพู แบบโพสต์ IG", sw: "🎀", bg: "#6B5A5E" }

    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (_) {
      src = await new Promise((res, rej) => {
        const img = new Image(); img.onload = () => res(img); img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }
    const w = src.width, h = src.height, max = 1400, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  }

          ${d.numbers.map((n, i) => `<div class="grid3">${field("เรื่อง", `numbers.${i}.label`, n.label)}${field("ตัวเลข", `numbers.${i}.value`, n.value)}${field("หน่วย", `numbers.${i}.unit`, n.unit)}</div>`).join("")}
        </section>

        <section class="ed-sec">
          <h3>Quiz</h3>
          <p>เลือกว่าข้อไหนคือคำตอบที่ถูก</p>
          ${d.quiz.map((q, i) => `<div class="qcard">
            ${field(`คำถามข้อ ${i + 1}`, `quiz.${i}.q`, q.q)}
            <div class="grid3" style="grid-template-columns:1fr 1fr 1fr">${q.opts.map((o, j) => field(`ตัวเลือก ${j + 1}`, `quiz.${i}.opts.${j}`, o)).join("")}</div>
            <label class="f"><span>คำตอบที่ถูก</span><select data-path="quiz.${i}.a" data-num="1">${q.opts.map((o, j) => `<option value="${j}" ${Number(q.a) === j ? "selected" : ""}>ตัวเลือก ${j + 1}</option>`).join("")}</select></label>
          </div>`).join("")}
        </section>

        <section class="ed-sec" style="border-bottom:0">
          <h3>จดหมาย</h3>
          <p>ขึ้นบรรทัดใหม่ได้ตามที่พิมพ์</p>
          ${field("ข้อความ", "letter", d.letter, "textarea", 'rows="10"')}
        </section>
      </div>`;
    updateBar();
  }

  function setPath(obj, path, val) {
    const keys = path.split("."); let o = obj;
    keys.slice(0, -1).forEach(k => o = o[k]);
    o[keys.at(-1)] = val;
  }

  editor.addEventListener("input", e => {
    const p = e.target.dataset.path; if (!p || e.target.type === "radio") return;
    let v = e.target.value;
    if (e.target.dataset.num) v = Number(v);
    if (p === "code") { v = v.replace(/\D/g, "").slice(0, 4); e.target.value = v; }
    setPath(draft, p, v); dirty = true; updateBar();
  });
  editor.addEventListener("change", async e => {
    if (e.target.type === "radio" && e.target.dataset.path === "theme") { draft.theme = e.target.value; dirty = true; editor.querySelectorAll(".theme-pick label").forEach(l => l.classList.toggle("on", l.querySelector("input").value === draft.theme)); return; }
    if (e.target.dataset.path && e.target.tagName === "SELECT") { setPath(draft, e.target.dataset.path, e.target.dataset.num ? Number(e.target.value) : e.target.value); dirty = true; return; }
    const which = e.target.dataset.photo; if (which === undefined) return;
    const files = [...e.target.files]; if (!files.length) return;
    setStatus("กำลังย่อขนาดรูป…");
    let failed = 0;
    for (const file of files) {
      try {
        const url = await compress(file);
        if (which === "cover") draft.cover.photo = url;
        else { const ph = draft.moments[Number(which)].photos; if (ph.length < 6) ph.push(url); }
      } catch (_) { failed++; }
    }
    dirty = true; setStatus(failed ? `${failed} รูปเปิดไม่ได้ ลองใช้ JPG หรือ PNG` : ""); renderEditor();
  });
  editor.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const i = Number(b.dataset.i), m = draft.moments;
    switch (b.dataset.act) {
      case "close": closeEditor(); return;
      case "rmcover": draft.cover.photo = ""; break;
      case "up": [m[i - 1], m[i]] = [m[i], m[i - 1]]; break;
      case "down": [m[i + 1], m[i]] = [m[i], m[i + 1]]; break;
      case "del": if (!confirm("ลบหน้านี้ออกจากสมุด?")) return; m.splice(i, 1); break;
      case "add": m.push({ photos: [], pos: "center", date: "", place: "", big: "New Chapter", script: "", title: "", note: "" }); break;
      case "rmphoto": m[i].photos.splice(Number(b.dataset.j), 1); break;
    }
    dirty = true; renderEditor();
  });

  let dirty = false, saving = false;
  function setStatus(t) { const s = document.getElementById("edStatus"); if (s) s.textContent = t; }
  function updateBar() {
    const bytes = new Blob([buildHTML(draft)]).size, mb = (bytes / 1048576).toFixed(1), over = bytes > MAX_BYTES * 0.95;
    edBar.innerHTML = `<span class="size ${over ? "over" : ""}">ขนาดสมุด ${mb} / 16 MB${over ? " · เต็มแล้ว ลบหรือเปลี่ยนรูปบางรูป" : ""}</span>
      ${downloadsNs ? `<button class="sbtn" data-bar="download">ดาวน์โหลดไฟล์</button>` : ""}
      <button class="sbtn" data-bar="preview">ดูตัวอย่าง</button>
      <button class="sbtn primary" data-bar="save" ${over || saving ? "disabled" : ""}>${saving ? "กำลังบันทึก…" : "บันทึกสมุด"}</button>
      <span class="status" id="edStatus"></span>`;
  }
  edBar.addEventListener("click", async e => {
    const b = e.target.closest("[data-bar]"); if (!b) return;
    if (b.dataset.bar === "preview") { data = JSON.parse(JSON.stringify(draft)); unlocked = true; closeEditor(true); render(1); return; }
    if (b.dataset.bar === "download") {
      try { await downloadsNs.save({ filename: "our-story.html", data: buildHTML(draft) }); }
      catch (err) { if (err && err.code === "unavailable") { downloadsNs = null; updateBar(); } }
      return;
    }
    if (b.dataset.bar === "save") {
      if (!/^\d{4}$/.test(draft.code)) { setStatus("รหัสต้องเป็นตัวเลข 4 หลัก"); return; }
      saving = true; updateBar(); setStatus("กำลังบันทึก หน้าจะโหลดใหม่เมื่อเสร็จ");
      try { await artifactNs.publish(buildHTML(draft)); }
      catch (err) {
        saving = false; updateBar();
        const code = err && err.code;
        if (code === "conflict") setStatus("มีคนบันทึกสมุดเวอร์ชันใหม่ไปก่อน หน้ากำลังโหลดใหม่");
        else if (code === "not_writer" || code === "not_granted" || code === "consent_required") { setStatus("หน้านี้เปิดแบบอ่านอย่างเดียว บันทึกไม่ได้"); }
        else if (code === "too_large") setStatus("สมุดใหญ่เกิน 16 MB ลบหรือเปลี่ยนรูปบางรูปก่อน");
        else if (code === "rate_limited") setStatus("บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่");
        else setStatus("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
      }
    }
  });

  function openEditor() {
    if (!draft) draft = JSON.parse(JSON.stringify(data));
    renderEditor(); editor.hidden = false; edBar.hidden = false; editor.scrollTop = 0;
  }
  function closeEditor() { editor.hidden = true; edBar.hidden = true; }
  document.getElementById("editBtn").onclick = openEditor;
  window.addEventListener("beforeunload", e => { if (dirty && !saving) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- capabilities ---------- */
  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [user, art, dl] = await Promise.all([window.claude.use("user"), window.claude.use("artifact"), window.claude.use("downloads")]);
      const canEdit = user ? await user.canEdit() : false;
      if (art && canEdit) {
        artifactNs = art; downloadsNs = dl;
        document.getElementById("editBtn").hidden = false;
      }
    } catch (_) { /* read-only view */ }
  })();

  render(0);
})();
</script>
</body>
</html>
